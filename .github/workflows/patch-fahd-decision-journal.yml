name: Patch Fahd decision journal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/api/fahd-chat/route.ts')
          text = path.read_text(encoding='utf-8')

          import_line = 'import { saveMarketDecisionJournalEntry } from "@/lib/fahd/decision-journal";\n'
          import_anchor = 'import { buildFahdResponse } from "@/lib/fahd/compact-response";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          journal_call = '''await saveMarketDecisionJournalEntry({
              requestMessage: message,
              decision: output,
              source: "fahd_chat",
            });'''

          if 'await saveMarketDecisionJournalEntry({' not in text:
              pattern = re.compile(
                  r'(?P<indent>^[ \t]*)const output = await getMarketDecision\([\s\S]*?^\s*\);',
                  re.MULTILINE,
              )
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one market decision call, found {len(matches)}')

              match = matches[0]
              indent = match.group('indent')
              injected = match.group(0) + '\n' + indent + journal_call.replace('\n', '\n' + indent)
              text = text[:match.start()] + injected + text[match.end():]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/fahd-chat/route.ts
          if git diff --cached --quiet; then
            echo "Route already patched; nothing to commit."
            exit 0
          fi
          git commit -m "Record Fahd market decisions"
          git push
