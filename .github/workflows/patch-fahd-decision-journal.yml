name: Patch Fahd decision journal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch route
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/api/fahd-chat/route.ts')
          text = path.read_text(encoding='utf-8')

          import_line = 'import { saveMarketDecisionJournalEntry } from "@/lib/fahd/decision-journal";\n'
          import_anchor = 'import { buildFahdResponse } from "@/lib/fahd/compact-response";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          call_marker = 'await saveMarketDecisionJournalEntry({'
          if call_marker not in text:
              lines = text.splitlines(keepends=True)
              block_index = next(
                  (i for i, line in enumerate(lines)
                   if 'block.name === "get_market_decision"' in line),
                  None,
              )
              if block_index is None:
                  raise SystemExit('get_market_decision block not found')

              call_index = next(
                  (i for i in range(block_index, min(len(lines), block_index + 30))
                   if 'const output = await getMarketDecision(' in lines[i]),
                  None,
              )
              if call_index is None:
                  raise SystemExit('getMarketDecision call not found inside tool block')

              end_index = next(
                  (i for i in range(call_index + 1, min(len(lines), call_index + 10))
                   if lines[i].strip() == ');'),
                  None,
              )
              if end_index is None:
                  raise SystemExit('getMarketDecision call terminator not found')

              indent = lines[call_index][:len(lines[call_index]) - len(lines[call_index].lstrip())]
              insertion = [
                  f'{indent}try {{\n',
                  f'{indent}  await saveMarketDecisionJournalEntry({{\n',
                  f'{indent}    requestMessage: message,\n',
                  f'{indent}    decision: output,\n',
                  f'{indent}    source: "fahd_chat",\n',
                  f'{indent}  }});\n',
                  f'{indent}}} catch (journalError) {{\n',
                  f'{indent}  console.error("Fahd decision journal write failed:", journalError);\n',
                  f'{indent}}}\n',
              ]
              lines[end_index + 1:end_index + 1] = insertion
              text = ''.join(lines)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/fahd-chat/route.ts
          if git diff --cached --quiet; then
            echo "Route already patched; nothing to commit."
            exit 0
          fi
          git commit -m "Record Fahd market decisions"
          git push
