name: Apply Fahd trigger checklist patch

on:
  push:
    paths:
      - ".github/workflows/apply-fahd-trigger-checklist.yml"

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: git apply --check .github/patches/fahd-trigger-checklist.patch && git apply .github/patches/fahd-trigger-checklist.patch

      - name: Remove one-time files
        run: git rm .github/patches/fahd-trigger-checklist.patch .github/workflows/apply-fahd-trigger-checklist.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/fahd-chat/route.ts lib/fahd-system-prompt.ts
          git commit -m "Expose Fahd trigger checklist in synthesis"
          git push
